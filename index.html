<!DOCTYPE html>
<html>
<head>
    <title>Faculty of Engineering - University of Moratuwa</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
        }

        h1 {
            margin-bottom: 5px;
            color: #0b2d50;
        }

        h2 {
            margin-top: 0;
            color: #d4a900;
        }

        form {
            margin-top: 40px;
        }

        input {
            padding: 8px;
            margin: 8px;
        }

        button {
            padding: 8px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Faculty of Engineering</h1>
    <h2>University of Moratuwa</h2>

    <h3>User Registration</h3>

    <form method="POST">

        <label>Name:</label>
        <input type="text" name="name" required>

        <br><br>

        <label>Email:</label>
        <input type="email" name="email" required>

        <br><br>

        <button type="submit">Save</button>

    </form>

</body>
</html>
